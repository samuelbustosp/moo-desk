<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1176 1024" width="1176" height="1024">
  <defs>
    <style>
      .moo-think-head {
        transform-origin: 588px 600px;
        animation: moo-head-tilt 3.2s ease-in-out infinite;
      }
      .moo-eyes-group {
        transform-origin: 588px 380px;
        animation: moo-eyes-wander 3.2s ease-in-out infinite;
      }
      .moo-brow {
        transform-origin: 400px 180px;
        animation: moo-brow-ponder 3.2s ease-in-out infinite;
      }
      .bubble-1 {
        transform-origin: 980px 190px;
        animation: moo-bubble-pop 2.4s ease-in-out infinite;
      }
      .bubble-2 {
        transform-origin: 1060px 120px;
        animation: moo-bubble-pop 2.4s ease-in-out 0.4s infinite;
      }
      .bubble-3 {
        transform-origin: 1130px 45px;
        animation: moo-bubble-pop 2.4s ease-in-out 0.8s infinite;
      }

      @keyframes moo-head-tilt {
        0%, 100% { transform: rotate(0deg) translateY(0); }
        35% { transform: rotate(-3.5deg) translateY(-10px); }
        70% { transform: rotate(2deg) translateY(-5px); }
      }

      @keyframes moo-eyes-wander {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(25px, -20px); } /* Mira arriba a la derecha */
        50% { transform: translate(10px, -25px); } /* Mira arriba al centro */
        75% { transform: translate(-20px, -18px); } /* Mira arriba a la izquierda */
      }

      @keyframes moo-brow-ponder {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        35% { transform: translateY(-12px) rotate(-6deg); }
        70% { transform: translateY(4px) rotate(3deg); }
      }

      @keyframes moo-bubble-pop {
        0%, 100% { transform: scale(0.85); opacity: 0.35; }
        50% { transform: scale(1.15); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Cabeza de Moo con inclinación pensativa -->
  <g class="moo-think-head">
    <!-- Silueta blanca -->
    <rect x="76" y="0" width="1024" height="560" rx="192" fill="#FFFFFF" />
    <rect x="0" y="464" width="1176" height="560" rx="192" fill="#FFFFFF" />

    <!-- Ceja cuadrada inclinada pensativa -->
    <rect class="moo-brow" x="310" y="170" width="160" height="34" rx="17" fill="#070708" transform="rotate(-10 390 187)" />

    <!-- Ojos estrictamente cuadrados/rectangulares que buscan ideas -->
    <g class="moo-eyes-group">
      <!-- Ojo izquierdo cuadrado -->
      <rect x="294" y="250" width="216" height="216" rx="44" fill="#070708" />
      <!-- Ojo derecho rectangular duditativo -->
      <rect x="700" y="290" width="206" height="136" rx="38" fill="#070708" />
      <!-- Boquita dubitativa sutil y rectangular redondeada -->
      <rect x="528" y="530" width="120" height="26" rx="13" fill="#070708" />
    </g>
  </g>

  <!-- Burbujas de pensamiento flotando en la esquina superior derecha -->
  <g fill="#A78BFA">
    <circle class="bubble-1" cx="980" cy="190" r="32" />
    <circle class="bubble-2" cx="1060" cy="120" r="48" />
    <circle class="bubble-3" cx="1130" cy="45" r="62" />
  </g>
</svg>
