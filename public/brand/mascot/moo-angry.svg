<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1176 1024" width="1176" height="1024">
  <defs>
    <style>
      .moo-angry-body {
        transform-origin: 588px 600px;
        animation: moo-angry-tremble 1.8s ease-in-out infinite;
      }
      .moo-anger-mark {
        transform-origin: 1040px 120px;
        animation: moo-anger-pulse 1.2s ease-in-out infinite;
      }

      @keyframes moo-angry-tremble {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        15% { transform: translateY(-4px) rotate(-0.8deg); }
        30% { transform: translateY(2px) rotate(0.8deg); }
        45% { transform: translateY(-3px) rotate(-0.5deg); }
        60% { transform: translateY(1px) rotate(0.5deg); }
        75% { transform: translateY(0) rotate(0deg); }
      }

      @keyframes moo-anger-pulse {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
        50% { transform: scale(1.18) rotate(4deg); opacity: 1; }
      }
    </style>
  </defs>

  <g class="moo-angry-body">
    <!-- Silueta blanca -->
    <rect x="76" y="0" width="1024" height="560" rx="192" fill="#FFFFFF" />
    <rect x="0" y="464" width="1176" height="560" rx="192" fill="#FFFFFF" />

    <!-- Ceja izquierda fruncida agresiva -->
    <rect x="248" y="225" width="240" height="38" rx="19" fill="#070708" transform="rotate(18 368 244)" />

    <!-- Ceja derecha fruncida agresiva -->
    <rect x="688" y="225" width="240" height="38" rx="19" fill="#070708" transform="rotate(-18 808 244)" />

    <!-- Ojos entrecerrados con intensidad -->
    <rect x="274" y="295" width="226" height="195" rx="44" fill="#070708" />
    <rect x="678" y="295" width="224" height="195" rx="44" fill="#070708" />

    <!-- Boquita fruncida hacia abajo -->
    <path d="M 495 585 Q 588 525 681 585" stroke="#070708" stroke-width="40" stroke-linecap="round" fill="none" />

    <!-- Rubor rojizo caliente de enfado -->
    <ellipse cx="230" cy="480" rx="68" ry="38" fill="#F87171" opacity="0.65" />
    <ellipse cx="946" cy="480" rx="68" ry="38" fill="#F87171" opacity="0.65" />
  </g>

  <!-- Símbolo de furia cómico (💢) flotante animado -->
  <g class="moo-anger-mark" transform="translate(1000, 70) scale(1.2)">
    <path d="M 22 8 C 36 26, 46 26, 60 8 M 8 22 C 26 36, 26 46, 8 60 M 60 74 C 46 56, 36 56, 22 74 M 74 60 C 56 46, 56 36, 74 22" fill="none" stroke="#EF4444" stroke-width="13" stroke-linecap="round" />
  </g>
</svg>