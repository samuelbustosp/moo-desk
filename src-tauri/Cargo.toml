[package]
name = "moo-desk"
version = "0.1.0"
description = "Moo Desk — Compañero de escritorio personal flotante"
authors = ["Moo Team"]
edition = "2021"

[lib]
name = "moo_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-store = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
